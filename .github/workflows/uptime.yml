name: Site down alert

# Every 30 minutes, loads Soul Vault, the NuRenaissance site, CERTIFIED, NuDirectory and PODI. Read-only: it submits nothing.
# If a site is down (three tries, 10 seconds apart) the run fails and GitHub emails the repo owner.
# Run it by hand any time from the Actions tab ("Run workflow"). GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-sites.mjs
