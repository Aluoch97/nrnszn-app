name: Daily recap

# Every morning, asks the site to check for a new Certified Lounge recap video and e-mail the show's subscribers.
# Does nothing until the GitHub secret RECAP_CRON_TOKEN is set (same value as the Cloudflare secret of the same name).
# Run it by hand any time from the Actions tab ("Run workflow"); add "preview" to send yourself a sample e-mail instead.
on:
  schedule:
    - cron: '17 15 * * *' # about 10am Nashville in winter, 11am in summer (GitHub uses UTC)
  workflow_dispatch:
    inputs:
      preview:
        description: 'Send a sample recap e-mail to Nick instead of running the check'
        type: boolean
        default: false

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the recap check
        env:
          RECAP_CRON_TOKEN: ${{ secrets.RECAP_CRON_TOKEN }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [ -z "$RECAP_CRON_TOKEN" ]; then echo "RECAP_CRON_TOKEN is not set yet, so the old Apps Script timer is still doing this. Nothing to do."; exit 0; fi
          url="https://www.nrnszn.com/api/survey-recap"
          if [ "$PREVIEW" = "true" ]; then url="$url?preview=1"; fi
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST -H "authorization: Bearer $RECAP_CRON_TOKEN" "$url")
          cat response.json; echo
          if [ "$code" = "503" ]; then echo "The site says it is not switched on yet (secrets missing in Cloudflare): the old Apps Script timer still sends the recap."; exit 0; fi
          test "$code" = "200"
