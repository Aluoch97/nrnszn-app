<style>
  #nrn-select, #nrn-select *, #nrn-select *::before, #nrn-select *::after {
    box-sizing: border-box;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #nrn-select {
    position: relative;
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    line-height: 1.55;
    color: #efe4ff;
    background: #0a0614;
    padding: 24px 20px;
    border: 1px solid #ffd54a;
    border-radius: 2px;
    width: 480px;
    max-width: 100%;
    max-height: 95vh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 24px rgba(255,213,74,0.25), inset 0 0 40px rgba(255,213,74,0.04);
    overflow: hidden;
  }
  #nrn-viewport {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-right: 4px;
  }
  .nrn-page[hidden] { display: none; }
  #nrn-select::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,213,74,0.03) 0px, rgba(255,213,74,0.03) 1px, transparent 1px, transparent 3px);
  }
  .nrn-logo { display: block; width: 72px; height: 72px; margin: 0 auto 10px; filter: drop-shadow(0 0 10px rgba(168,116,255,0.5)); }
  .nrn-brand-name { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 1px; color: #ffd54a; text-align: center; text-shadow: 0 0 10px rgba(255,213,74,0.6); line-height: 1.3; }
  .nrn-form-title { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500; letter-spacing: 2px; color: #c9a6ff; text-align: center; text-transform: uppercase; margin-bottom: 10px; }
  .nrn-form-sub { text-align: center; color: #b8a8d9; font-size: 17px; margin-bottom: 18px; }
  .nrn-help-text { color: #b8a8d9; font-size: 17px; line-height: 1.5; margin: 0 0 14px; }
  .nrn-step-label { font-size: 16px; font-weight: 700; letter-spacing: 1px; color: #ffd54a; text-shadow: 0 0 8px rgba(255,213,74,0.5); margin: 24px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #4a2f7a; }
  .nrn-step-label:first-of-type { margin-top: 0; }
  .nrn-link-btn { display: block; width: 100%; text-align: center; background: none; border: none; color: #c9a6ff; font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: 0.3px; cursor: pointer; padding: 6px 0 18px; text-decoration: underline; }
  .nrn-link-btn:hover, .nrn-link-btn:focus-visible { color: #7dffef; }
  .nrn-link-btn:focus-visible, .nrn-card:focus-visible, .nrn-tier:focus-visible, .nrn-quiz-opt:focus-visible, #nrn-cta:focus-visible, #nrn-cta-estimate:focus-visible, #nrn-estimate-submit:focus-visible, .nrn-slot:focus-visible, #nrn-book-submit:focus-visible, .nrn-toggle:focus-visible { outline: 2px solid #ffd54a; outline-offset: 2px; }

  #nrn-quiz { background: #150d28; border: 1px solid #4a2f7a; padding: 16px; margin-bottom: 20px; box-shadow: 0 0 16px rgba(255,213,74,0.12); }
  #nrn-quiz h4 { font-size: 17px; font-weight: 700; line-height: 1.5; margin: 0 0 14px; color: #ffd54a; text-shadow: 0 0 6px rgba(255,213,74,0.5); }
  .nrn-quiz-opt { display: block; width: 100%; text-align: left; background: #061a0e; color: #efe4ff; border: 1px solid #4a2f7a; border-radius: 2px; padding: 13px 14px; margin-bottom: 10px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 17px; min-height: 44px; }
  .nrn-quiz-opt:hover, .nrn-quiz-opt:focus-visible { border-color: #ffd54a; background: #0a2617; color: #ffd54a; }

  #nrn-grid { display: flex; flex-direction: column; gap: 12px; }
  .nrn-loading { color: #b8a8d9; font-size: 17px; padding: 10px 0; }
  .nrn-load-error { color: #ff5f5f; font-size: 17px; line-height: 1.5; padding: 10px 0; }
  .nrn-card {
    position: relative; cursor: pointer;
    background: #150d28;
    border: 1px solid #4a2f7a;
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(255,213,74,0.08);

    transition: border-color .1s, box-shadow .1s;

  .nrn-check { font-size: 20px; flex-shrink: 0; }

  .nrn-card:hover, .nrn-card:focus-visible { border-color: #ffd54a; box-shadow: 0 0 16px rgba(255,213,74,0.3); }

  .nrn-card.suggested { border-color: #c9a6ff; box-shadow: 0 0 18px rgba(201,166,255,0.4); }

  .nrn-card .nrn-price { font-size: 16px; color: #ffd54a; white-space: nowrap; font-weight: 700; }
  .nrn-card .nrn-icon { font-size: 30px; flex-shrink: 0; line-height: 1; filter: drop-shadow(0 0 6px rgba(255,213,74,0.5)); }

  .nrn-badge { position: absolute; top: -14px; right: 8px; background: #ffd54a; color: #2b1600; font-weight: 700; font-size: 16px; padding: 4px 11px; border-radius: 2px; text-transform: uppercase; letter-spacing: 0.3px; box-shadow: 0 0 8px rgba(255,213,74,0.6); }
  .nrn-badge.nrn-suggest-badge { right: auto; left: 8px; background: #c9a6ff; color: #2b1650; box-shadow: 0 0 8px rgba(201,166,255,0.6); }

  .nrn-config { display: block; margin-top: 14px; padding-top: 14px; border-top: 1px solid #4a2f7a; }
  .nrn-config-row { display: block; margin-top: 12px; }
  .nrn-config-label { font-weight: 700; font-size: 16px; color: #b8a8d9; display: block; margin-bottom: 6px; }

<script>

(function () {
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby9JJPeqlNedlwfec3uMWYF7btoCGJUJB8CJnTmbWxfByhtuO23eCARYziNqdeqT3tfFQ/exec';
  var STORAGE_KEY = 'nrn_service_selection_v4'; // bumped when the video edit tiers changed: saved selections store tier positions, which shifted
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  // User-typed text (name, phone, free-text notes, etc.) gets re-inserted
  // into innerHTML when a form re-renders. Escape it so a stray quote or
  // "</textarea>" in someone's input can't break the markup or, worse,
  // inject content into the page.
  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // POST with a JSON body instead of GET query params, so name/email/
  // phone/notes don't end up sitting in browser history or request
  // logs. Content-Type is deliberately text/plain, not application/
  // json — Apps Script Web Apps can't handle a CORS preflight, and
  // application/json triggers one from the browser; text/plain does
  // not, while still letting the body carry real JSON that Code.gs
  // parses manually (same trick the existing Fathom webhook handler
  // already relies on).
  function postAction(payload) {
    return fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
  }

  var PAGE_IDS = ['nrn-page-services', 'nrn-page-about', 'nrn-page-actions', 'nrn-page-flow'];
  function showPage(activeId) {
    PAGE_IDS.forEach(function (id) {
      document.getElementById(id).hidden = (id !== activeId);
    });
    document.getElementById('nrn-viewport').scrollTop = 0;
  }

  var services = [];
  var bundles = [];
  var selected = {}; // { serviceId: config }
  var suggestedId = null;
  var chosenSlot = null;
  var leadName = '';
  var leadEmail = '';
  var leadPhone = '';
  var leadLocation = '';
  var leadDetails = '';
  var leadRole = null;
  var leadSubmitted = false;

  loadStoredSelection();

  fetch(SCRIPT_URL + '?action=data')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      services = data.services || [];
      bundles = data.bundles || [];
      try {
        pruneStaleSelections();
        renderGrid();
        renderLoadout();
        renderBundleSuggestion();
      } catch (renderErr) {
        // Data loaded fine — something about a saved selection broke
        // rendering. Don't blame the fetch; wipe the bad state and
        // retry once with a clean slate rather than showing a
        // misleading "couldn't load" message.
        console.error('NuRenaissance service select render failed, resetting selection', renderErr);
        selected = {};
        saveSelection();
        renderGrid();
        renderLoadout();
        renderBundleSuggestion();
      }
    })
    .catch(function (err) {
      console.error('NuRenaissance service select load failed', err);
      document.getElementById('nrn-grid').innerHTML =
        '<div class="nrn-load-error">Couldn\u2019t load services right now. Refresh the page to try again.</div>';
    });

  function loadStoredSelection() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) selected = JSON.parse(raw) || {};
    } catch (err) { selected = {}; }
  }

  function saveSelection() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(selected)); } catch (err) {}
  }

  function pruneStaleSelections() {
    Object.keys(selected).forEach(function (id) {
      var s = services.find(function (x) { return x.id === id; });
      if (!s) { delete selected[id]; return; }
      // A saved selection from an older version of this widget can have
      // a different shape than the current pricing model expects (e.g.
      // a single tierIndex from before multi-select existed). Reset
      // anything that doesn't match rather than let it crash rendering.
      if (!isValidConfigShape(s, selected[id])) {
        selected[id] = defaultConfig(s);
      }
    });
  }

  function isValidConfigShape(s, cfg) {
    if (!cfg || typeof cfg !== 'object') return false;
    if (s.pricingModel === 'package') return Array.isArray(cfg.tierIndices) && cfg.tierIndices.length > 0;
    if (s.pricingModel === 'hourly') return typeof cfg.hours === 'number';
    if (s.pricingModel === 'hourly_plus_edit') return typeof cfg.hours === 'number' && typeof cfg.tierIndex === 'number';
    if (s.pricingModel === 'per_page') return typeof cfg.pages === 'number';
    return true;
  }

  // Add-on pricing straight from the signed service agreements — not
  // tracked in the Sheet, hardcoded here. Update these if a contract's
  // terms change.
  var REVISION_FEE = { video: 75, web: 50, 'graphic-design': 50 };
  var VIDEO_LOCATION_FEE = 50;          // per additional location beyond the primary
  var VIDEO_WHITE_LABEL_PCT = 0.25;     // 25% of production+edit to remove branding
  var GRAPHIC_RUSH_FEE = 40;            // 48-hour rush delivery for Graphic design
  // Photography rates are hardcoded here (like STANDARD_DEPOSIT) so an old
  // value left in the Sheet can never override them.
  var PHOTO_ON_LOCATION_RATE = 100;     // per hour
  var PHOTO_STUDIO_RATE = 150;          // per hour
  var PHOTO_RUSH_FEE = 75;              // 48-hour turnaround on photos
  // Standard deposit across every session/booking-based service — Video
  // (including music videos, which used to charge a separate, higher
  // deposit), Photography, Livestream, Web design, and Interview.
  // Graphic Design intentionally has no deposit (full fee upfront, per
  // its agreement) and isn't affected by this constant. Admin's package
  // tiers each define their own payment terms directly and don't use
  // this either.
  var STANDARD_DEPOSIT = 50;
  var PHOTO_EXTRA_PHOTO_SINGLE = 10;
  var PHOTO_EXTRA_PHOTO_BUNDLE_SIZE = 5;
  var PHOTO_EXTRA_PHOTO_BUNDLE_PRICE = 40;
  var INTERVIEW_TALENT_FEE = 75;
  var INTERVIEW_FACILITY_FEE = 60;
  var INTERVIEW_LOCATION_FEE = 50;
  var INTERVIEW_REVISION_FEE = 75;
  // Video shoot pricing (every video type except Raise the Bar): $500 covers
  // the first 2 hours, then $100 for each additional hour. Edit is added on
  // top. Hardcoded so the old per-hour rates in the Sheet can't override it.
  var VIDEO_BASE_SHOOT = 500;
  var VIDEO_BASE_HOURS = 2;
  var VIDEO_EXTRA_HOUR_RATE = 100;
  var RAISE_THE_BAR_PRICE = 100;   // one mic performance series
  var RAISE_THE_BAR_DEPOSIT = 50;  // $50 to book, remaining $50 due at the shoot
  var PHOTOGRAPHY_EXAMPLE_URL = 'https://www.nrnszn.com/gallery';
  var VIDEO_TYPE_EXAMPLES = {
    music: 'https://www.youtube.com/playlist?list=PLVprhlbgSo1sfS02MFZbi3t7pCJkoy9rd',
    interview: 'https://www.youtube.com/playlist?list=PLVprhlbgSo1vN-wkuvFDjabBQ85XURyTd',
    podcast: 'https://www.youtube.com/@nrnszn/podcasts',
    recap: 'https://www.youtube.com/playlist?list=PLVprhlbgSo1s5YSOxWfYGTLEDvkKjCboz',
    raisethebar: 'https://youtube.com/playlist?list=PLC2-QbyYIV7c&si=Yy9vhWvvACvWjzjZ'
    // promo intentionally has none — no link given for it
  };
  function renderVideoExampleLink(videoType) {
    var url = VIDEO_TYPE_EXAMPLES[videoType];
    if (!url) return '';
    return '<span class="nrn-help-text" style="margin:0 0 8px;"><a href="' + url + '" target="_blank" rel="noopener noreferrer" style="color:#c9a6ff;">\uD83C\uDFA5 See examples</a></span>';
  }
  var ADMIN_DIGITAL_FOUNDATION_REVISION_FEE = 25;

  // Bulk-photo pricing: bundles of 5 at $40, remainder at $10 each —
  // matches the agreement's "5 for $40" bundle rate.
  function extraPhotoCost(n) {
    n = Math.max(0, n || 0);
    var bundles = Math.floor(n / PHOTO_EXTRA_PHOTO_BUNDLE_SIZE);
    var remainder = n % PHOTO_EXTRA_PHOTO_BUNDLE_SIZE;
    return bundles * PHOTO_EXTRA_PHOTO_BUNDLE_PRICE + remainder * PHOTO_EXTRA_PHOTO_SINGLE;
  }

  var VIDEO_TYPES = [
    { value: 'music', label: '\uD83C\uDFB5 Music video' },
    { value: 'podcast', label: '\uD83C\uDF99\uFE0F Podcast' },
    { value: 'recap', label: '\uD83D\uDCC5 Event recap' },
    { value: 'promo', label: '\uD83D\uDCE3 Promo' },
    { value: 'interview', label: '\uD83C\uDF99 Interview' },
    { value: 'raisethebar', label: '\uD83C\uDFA4 Raise the Bar' }
  ];

  // Edit-length pricing for EVERY video type, Interview included. Hardcoded
  // here (like STANDARD_DEPOSIT and the photo rates) so old tier rows left
  // in the Sheet can't override it. "Up to 5 min" covers every video up to
  // five minutes, however short.
  var VIDEO_EDIT_TIERS = [
    { name: 'Up to 5 min', price: 300 },
    { name: 'Over 5 min', price: 600 }
  ];

  // Shoot cost = $500 base (first 2 hours) + $100 per extra hour. Adds the
  // matching breakdown lines so they still add up to the total.
  function videoShootCost(hours, breakdown) {
    var extra = Math.max(0, hours - VIDEO_BASE_HOURS);
    var extraCost = Math.round(extra * VIDEO_EXTRA_HOUR_RATE * 100) / 100;
    breakdown.push('\uD83C\uDFAC Shoot, first ' + VIDEO_BASE_HOURS + ' hrs: $' + VIDEO_BASE_SHOOT);
    if (extra > 0) breakdown.push('\uD83D\uDD52 ' + extra + ' extra hr(s) @ $' + VIDEO_EXTRA_HOUR_RATE + '/hr: $' + extraCost);
    return VIDEO_BASE_SHOOT + extraCost;
  }


  function photoFacilityRate(s) {
    return PHOTO_STUDIO_RATE;
  }

  // The "starting at" teaser on each card comes from the Sheet via Code.gs,
  // which would still reflect the old photography rate — so photography's
  // is computed here from the current rate instead.
  function displayStartingPrice(s) {
    if (s.id === 'photography') return PHOTO_ON_LOCATION_RATE * s.minHours + STANDARD_DEPOSIT;
    if (s.id === 'video') {
      var cheapest = Infinity;
      VIDEO_TYPES.forEach(function (v) {
        if (v.value === 'raisethebar') return;
        var cfg = defaultConfig(s);
        cfg.videoType = v.value; cfg.tierIndex = 0; cfg.interviewTier = 0; cfg.studio = 'standard';
        cheapest = Math.min(cheapest, computePrice(s, cfg).total);
      });
      return cheapest;
    }
    return s.startingPrice;
  }

  function defaultConfig(s) {
    if (s.pricingModel === 'package') return { tierIndices: [0], consultHours: 1, dfRevisions: 0, revisions: 0, rushDelivery: false };
    if (s.pricingModel === 'hourly') {
      if (s.id === 'photography') return { hours: s.minHours, studio: 'standard', extraPhotos: 0, rushDelivery: false };
      return { hours: s.minHours };
    }
    if (s.pricingModel === 'hourly_plus_edit') return { hours: VIDEO_BASE_HOURS, studio: 'standard', videoType: 'promo', tierIndex: 0, interviewTier: 0, revisions: 0, extraLocations: 0, whiteLabel: false, talent: false, facility: false, interviewRevisions: 0, interviewLocations: 0 };
    if (s.pricingModel === 'per_page') return { pages: 1, revisions: 0 };
    return {};
  }

  // ---------------- Pricing ----------------

  function computePrice(s, cfg) {
    if (s.pricingModel === 'package') {
      var indices = (cfg.tierIndices && cfg.tierIndices.length) ? cfg.tierIndices : [0];
      var total = 0, depositSum = 0, allCredited = true, breakdown = [], labels = [];
      indices.forEach(function (i) {
        var t = s.tiers[i];
        if (!t) return;
        // Creative Consultation is billed per hour ($X/hr), not flat,
        // despite living in the same flat-tier list as everything else.
        var isHourlyTier = t.name === 'Creative consultation';
        var hours = cfg.consultHours || 1;
        var linePrice = isHourlyTier ? t.price * hours : t.price;
        total += linePrice + t.deposit;
        depositSum += t.deposit;
        if (t.deposit > 0 && !t.depositCredited) allCredited = false;
        breakdown.push('\uD83C\uDFAF ' + t.name + (isHourlyTier ? ' (' + hours + ' hrs @ $' + t.price + '/hr)' : '') + ': $' + linePrice);
        labels.push(t.name);

        // Digital Foundation-specific extra revisions ($25/round beyond
        // the 2 free ones included).
        if (t.name === 'Digital Foundation' && cfg.dfRevisions > 0) {
          var dfFee = cfg.dfRevisions * ADMIN_DIGITAL_FOUNDATION_REVISION_FEE;
          total += dfFee;
          breakdown.push('\uD83D\uDD01 ' + cfg.dfRevisions + ' extra revision round(s): $' + dfFee);
        }
      });

      // Graphic Design: extra revisions beyond the 2 free, applies once
      // for the whole order.
      if (s.id === 'graphic-design' && cfg.revisions > 0) {
        var gdFee = cfg.revisions * REVISION_FEE['graphic-design'];
        total += gdFee;
        breakdown.push('\uD83D\uDD01 ' + cfg.revisions + ' extra revision round(s): $' + gdFee);
      }
      if (s.id === 'graphic-design' && cfg.rushDelivery) {
        total += GRAPHIC_RUSH_FEE;
        breakdown.push('\u26A1 Rush delivery (48hr): $' + GRAPHIC_RUSH_FEE);
      }

      if (depositSum > 0) breakdown.push('\uD83D\uDCB3 Deposit: $' + depositSum);
      return {
        total: total,
        deposit: depositSum,
        depositCredited: allCredited,
        breakdown: breakdown,
        label: labels.join(' + ')
      };
    }
    if (s.pricingModel === 'hourly') {
      var rate = s.id === 'photography' ? (cfg.studio === 'facility' ? PHOTO_STUDIO_RATE : PHOTO_ON_LOCATION_RATE) : s.hourlyRate;
      var prod = rate * cfg.hours;
      var whereLabel = (s.id === 'photography' && cfg.studio === 'facility') ? ' (in-studio)' : (s.id === 'photography' ? ' (on-location)' : '');
      var hTotal = prod;
      var hBreakdown = ['\uD83D\uDD52 ' + cfg.hours + ' hrs @ $' + rate + '/hr' + whereLabel + ': $' + prod];
      if (s.id === 'photography') {
        if (cfg.extraPhotos > 0) {
          var photoFee = extraPhotoCost(cfg.extraPhotos);
          hTotal += photoFee;
          hBreakdown.push('\uD83D\uDDBC\uFE0F ' + cfg.extraPhotos + ' extra edited photo(s): $' + photoFee);
        }
        if (cfg.rushDelivery) {
          hTotal += PHOTO_RUSH_FEE;
          hBreakdown.push('\u26A1 Rush delivery (48hr): $' + PHOTO_RUSH_FEE);
        }
      }
      hTotal += STANDARD_DEPOSIT;
      hBreakdown.push('\uD83D\uDCB3 Deposit: $' + STANDARD_DEPOSIT);
      return {
        total: hTotal,
        deposit: STANDARD_DEPOSIT,
        depositCredited: true,
        breakdown: hBreakdown,
        label: cfg.hours + ' hrs'
      };
    }
    if (s.pricingModel === 'hourly_plus_edit') {
      if (cfg.videoType === 'interview') {
        var it = VIDEO_EDIT_TIERS[cfg.interviewTier || 0] || VIDEO_EDIT_TIERS[0];
        var itBreakdown = ['\uD83C\uDF99 Interview shoot: $' + VIDEO_BASE_SHOOT, '\u2702\uFE0F Edit, ' + it.name + ': $' + it.price];
        var itTotal = VIDEO_BASE_SHOOT + it.price;
        if (cfg.talent) { itTotal += INTERVIEW_TALENT_FEE; itBreakdown.push('\uD83C\uDFA4 On-screen talent: $' + INTERVIEW_TALENT_FEE); }
        if (cfg.facility) { itTotal += INTERVIEW_FACILITY_FEE; itBreakdown.push('\uD83C\uDFE0 Production facility: $' + INTERVIEW_FACILITY_FEE); }
        if (cfg.interviewLocations > 0) {
          var itLocFee = cfg.interviewLocations * INTERVIEW_LOCATION_FEE;
          itTotal += itLocFee;
          itBreakdown.push('\uD83D\uDCCD ' + cfg.interviewLocations + ' extra location(s): $' + itLocFee);
        }
        if (cfg.interviewRevisions > 0) {
          var itRevFee = cfg.interviewRevisions * INTERVIEW_REVISION_FEE;
          itTotal += itRevFee;
          itBreakdown.push('\uD83D\uDD01 ' + cfg.interviewRevisions + ' extra revision round(s): $' + itRevFee);
        }
        itTotal += STANDARD_DEPOSIT;
        itBreakdown.push('\uD83D\uDCB3 Deposit: $' + STANDARD_DEPOSIT);
        return { total: itTotal, deposit: STANDARD_DEPOSIT, depositCredited: true, breakdown: itBreakdown, label: 'Interview: ' + it.name };
      }
      if (cfg.videoType === 'raisethebar') {
        return {
          total: RAISE_THE_BAR_PRICE,
          deposit: RAISE_THE_BAR_DEPOSIT,
          depositCredited: true,
          breakdown: ['\uD83C\uDFA4 Raise the Bar performance: $' + RAISE_THE_BAR_PRICE, '\uD83D\uDCB3 Deposit: $' + RAISE_THE_BAR_DEPOSIT],
          label: 'Raise the Bar'
        };
      }
      var editTier = VIDEO_EDIT_TIERS[cfg.tierIndex] || VIDEO_EDIT_TIERS[0];
      var deposit = STANDARD_DEPOSIT;
      var depositCredited = true;
      var videoTypeLabel = (VIDEO_TYPES.find(function (v) { return v.value === cfg.videoType; }) || VIDEO_TYPES[3]).label;
      var vBreakdown = [videoTypeLabel];
      var shootCost = videoShootCost(cfg.hours, vBreakdown);
      var vTotal = shootCost + editTier.price;
      vBreakdown.push('\u2702\uFE0F Edit, ' + editTier.name + ': $' + editTier.price);
      if (cfg.extraLocations > 0) {
        var vLocFee = cfg.extraLocations * VIDEO_LOCATION_FEE;
        vTotal += vLocFee;
        vBreakdown.push('\uD83D\uDCCD ' + cfg.extraLocations + ' extra location(s): $' + vLocFee + ' (+$5/mi beyond 25mi, billed separately)');
      }
      if (cfg.revisions > 0) {
        var vRevFee = cfg.revisions * REVISION_FEE.video;
        vTotal += vRevFee;
        vBreakdown.push('\uD83D\uDD01 ' + cfg.revisions + ' extra revision round(s): $' + vRevFee);
      }
      if (cfg.whiteLabel) {
        var wlFee = Math.round((shootCost + editTier.price) * VIDEO_WHITE_LABEL_PCT);
        vTotal += wlFee;
        vBreakdown.push('\uD83C\uDFF7\uFE0F White-label (remove branding): $' + wlFee);
      }
      vTotal += deposit;
      vBreakdown.push('\uD83D\uDCB3 Deposit: $' + deposit);
      return {
        total: vTotal,
        deposit: deposit,
        depositCredited: depositCredited,
        breakdown: vBreakdown,
        label: editTier.name
      };
    }
    if (s.pricingModel === 'per_page') {
      var subtotal = s.pageRate * cfg.pages;
      var wTotal = subtotal;
      var wBreakdown = ['\uD83D\uDCC4 ' + cfg.pages + ' page(s) @ $' + s.pageRate + '/page: $' + subtotal];
      if (cfg.revisions > 0) {
        var wRevFee = cfg.revisions * REVISION_FEE.web;
        wTotal += wRevFee;
        wBreakdown.push('\uD83D\uDD01 ' + cfg.revisions + ' extra revision round(s): $' + wRevFee);
      }
      wTotal += STANDARD_DEPOSIT;
      wBreakdown.push('\uD83D\uDCB3 Deposit: $' + STANDARD_DEPOSIT);
      return {
        total: wTotal,
        deposit: STANDARD_DEPOSIT,
        depositCredited: true,
        breakdown: wBreakdown,
        label: cfg.pages + ' page(s)'
      };
    }
    if (s.pricingModel === 'quote_only') {
      return {
        total: 0,
        deposit: 0,
        depositCredited: false,
        breakdown: ['\uD83D\uDCAC Every project is scoped individually \u2014 book a free consultation and we\u2019ll figure out the right approach and price together.'],
        label: 'Custom quote'
      };
    }
    return { total: 0, deposit: 0, depositCredited: false, breakdown: [], label: '' };
  }

  // ---------------- "Not sure what you need?" quiz ----------------

  var quizQuestions = [
    {
      key: 'q1',
      text: "What's this for?",
      options: [
        { label: '\uD83C\uDFB5 Music or artist release', value: 'music' },
        { label: '\uD83C\uDFE2 Brand, event, or org', value: 'brand' },
        { label: '\uD83D\uDD01 Ongoing support', value: 'ongoing' }
      ]
    },
    {
      key: 'q2',
      text: 'What do you need?',
      options: [
        { label: '\uD83C\uDFA5 Video', value: 'video' },
        { label: '\uD83D\uDCF7 Photos', value: 'photography' },
        { label: '\uD83C\uDFA8 Flyers or graphics', value: 'graphic-design' },
        { label: '\uD83D\uDCBB A website', value: 'web' },
        { label: '\uD83D\uDCE1 A livestream', value: 'live' }
      ]
    }
  ];
  var quizAnswers = {};

  document.getElementById('nrn-help-toggle').addEventListener('click', function () {
    var panel = document.getElementById('nrn-quiz');
    panel.hidden = !panel.hidden;
    if (!panel.hidden) { quizAnswers = {}; renderQuizStep(0); }
  });

  function renderQuizStep(stepIndex) {
    var panel = document.getElementById('nrn-quiz');
    var q = quizQuestions[stepIndex];
    if (!q) { finishQuiz(); return; }
    panel.innerHTML = '<h4>' + q.text + '</h4>' +
      '<div class="nrn-help-text">Tap the option that fits best.</div>' +
      q.options.map(function (opt) {
        return '<button type="button" class="nrn-quiz-opt" data-value="' + opt.value + '">' + opt.label + '</button>';
      }).join('');
    Array.prototype.forEach.call(panel.querySelectorAll('.nrn-quiz-opt'), function (btn) {
      btn.addEventListener('click', function () {
        quizAnswers[q.key] = btn.dataset.value;
        if (q.key === 'q1' && btn.dataset.value === 'ongoing') { finishQuiz(); return; }
        renderQuizStep(stepIndex + 1);
      });
    });
  }

  function finishQuiz() {
    var panel = document.getElementById('nrn-quiz');
    suggestedId = quizAnswers.q1 === 'ongoing' ? 'admin' : (quizAnswers.q2 || null);
    panel.hidden = true;
    renderGrid();
    var card = document.querySelector('.nrn-card[data-id="' + suggestedId + '"]');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // ---------------- Service grid ----------------

  var SERVICE_ICONS = {
    video: '\uD83C\uDFA5',
    camera: '\uD83D\uDCF7',
    pen: '\uD83C\uDFA8',
    code: '\uD83D\uDCBB',
    broadcast: '\uD83D\uDCE1',
    briefcase: '\uD83D\uDCCB',
    mic: '\uD83C\uDFA4'
  };

  function renderGrid() {
    var grid = document.getElementById('nrn-grid');
    grid.innerHTML = services.map(function (s) {
      var isSelected = selected.hasOwnProperty(s.id);
      var isSuggested = suggestedId === s.id;
      var emoji = SERVICE_ICONS[s.icon] || '\u2B50';
      var priceLabel = s.pricingModel === 'quote_only' ? 'Custom quote' : ('$' + displayStartingPrice(s) + '+');

      return '' +
        '<div class="nrn-card' + (isSelected ? ' selected' : '') + (isSuggested ? ' suggested' : '') +
          '" data-id="' + s.id + '" role="button" tabindex="0" aria-pressed="' + isSelected + '" aria-label="' + s.name + ', ' + (s.pricingModel === 'quote_only' ? 'custom quote' : 'starting at $' + displayStartingPrice(s)) + (s.description ? '. ' + s.description : '') + '">' +
          (s.mostBooked ? '<span class="nrn-badge">\uD83D\uDD25 Most booked</span>' : '') +
          (isSuggested ? '<span class="nrn-badge nrn-suggest-badge">\u2B50 For you</span>' : '') +
          '<span class="nrn-card-row">' +
            '<span class="nrn-check" aria-hidden="true">' + (isSelected ? '\u2705' : '\u2B1C') + '</span>' +
            '<span class="nrn-icon" aria-hidden="true">' + emoji + '</span>' +
            '<span class="nrn-card-main">' +
              '<span class="nrn-name">' + s.name + '</span>' +
              '<span class="nrn-price">' + priceLabel + '</span>' +
            '</span>' +
          '</span>' +
          (s.description ? '<span class="nrn-card-desc" aria-hidden="true">' + s.description + '</span>' : '') +
          (isSelected ? renderConfig(s, selected[s.id]) : '') +
        '</div>';
    }).join('');

    Array.prototype.forEach.call(grid.querySelectorAll('.nrn-card'), function (card) {
      card.addEventListener('click', function (evt) {
        if (evt.target.closest('.nrn-config')) return;
        toggleService(card.dataset.id);
      });
      card.addEventListener('keydown', function (evt) {
        if (evt.target !== card) return; // let nested controls handle their own keys
        if (evt.key === 'Enter' || evt.key === ' ') {
          evt.preventDefault();
          toggleService(card.dataset.id);
        }
      });
    });

    services.forEach(function (s) {
      if (!selected.hasOwnProperty(s.id)) return;
      wireConfigControls(s);
    });
  }

  function renderConfig(s, cfg) {
    var price = computePrice(s, cfg);
    var html = '<span class="nrn-config">';

    if (s.pricingModel === 'package') {
      html += '<span class="nrn-config-row"><span class="nrn-help-text" style="margin:0 0 8px;">You can select more than one.</span><span class="nrn-tiers-stack">' +
        s.tiers.map(function (t, i) {
          var isOn = cfg.tierIndices.indexOf(i) !== -1;
          return '<button type="button" class="nrn-tier' + (isOn ? ' active' : '') +
            '" data-service="' + s.id + '" data-field="tierToggle" data-value="' + i + '" aria-pressed="' + isOn + '">' +
            (isOn ? '\u2705 ' : '\u2B1C ') + t.name + (t.description ? '<span class="nrn-tier-sub">' + t.description + '</span>' : '') + '</button>';
        }).join('') + '</span></span>';

      var selectedTiers = cfg.tierIndices.map(function (i) { return s.tiers[i]; }).filter(Boolean);
      var hasConsult = selectedTiers.some(function (t) { return t.name === 'Creative consultation'; });
      var hasDigitalFoundation = selectedTiers.some(function (t) { return t.name === 'Digital Foundation'; });

      if (hasConsult) {
        html += '<span class="nrn-config-row"><label class="nrn-config-label" for="nrn-consulthours-' + s.id + '">\uD83D\uDD52 Consultation hours</label>' +
          '<input type="number" id="nrn-consulthours-' + s.id + '" min="0.5" step="0.5" class="nrn-hours-input" data-service="' + s.id + '" data-field="consultHours" value="' + cfg.consultHours + '" /></span>';
      }
      if (hasDigitalFoundation) {
        html += '<span class="nrn-config-row"><label class="nrn-config-label" for="nrn-dfrevisions-' + s.id + '">\uD83D\uDD01 Extra revision rounds beyond the 2 free ($25/round)</label>' +
          '<input type="number" id="nrn-dfrevisions-' + s.id + '" min="0" step="1" class="nrn-hours-input" data-service="' + s.id + '" data-field="dfRevisions" value="' + cfg.dfRevisions + '" /></span>';
      }
      if (s.id === 'graphic-design') {
        html += '<span class="nrn-config-row"><label class="nrn-config-label" for="nrn-revisions-' + s.id + '">\uD83D\uDD01 Extra revision rounds beyond the 2 free ($50/round)</label>' +
          '<input type="number" id="nrn-revisions-' + s.id + '" min="0" step="1" class="nrn-hours-input" data-service="' + s.id + '" data-field="revisions" value="' + cfg.revisions + '" /></span>';
        html += '<span class="nrn-config-row"><span class="nrn-config-label">\u2795 Add-ons</span>' +
          '<span class="nrn-toggle-row">' +
            '<button type="button" class="nrn-toggle' + (cfg.rushDelivery ? ' active' : '') + '" data-service="' + s.id + '" data-field="rushDelivery" data-value="toggle" aria-pressed="' + !!cfg.rushDelivery + '">\u26A1 Rush delivery, 48hr (+$' + GRAPHIC_RUSH_FEE + ')</button>' +
          '</span></span>';
      }
    }

    if (s.pricingModel === 'hourly_plus_edit') {
      html += '<span class="nrn-config-row"><span class="nrn-config-label">\uD83C\uDFAC What kind of video?</span><span class="nrn-tiers">' +
        VIDEO_TYPES.map(function (v) {
          var isActive = cfg.videoType === v.value;
          return '<button type="button" class="nrn-tier' + (isActive ? ' active' : '') +
            '" data-service="' + s.id + '" data-field="videoType" data-value="' + v.value + '" aria-pressed="' + isActive + '">' + v.label + '</button>';
        }).join('') + '</span></span>';

      if (cfg.videoType === 'interview') {
        html += renderVideoExampleLink(cfg.videoType);
        html += '<span class="nrn-config-row"><span class="nrn-config-label">\u2702\uFE0F Edit length</span><span class="nrn-tiers-stack">' +
          VIDEO_EDIT_TIERS.map(function (t, i) {
            var isActive = (cfg.interviewTier || 0) === i;
            return '<button type="button" class="nrn-tier' + (isActive ? ' active' : '') +
              '" data-service="' + s.id + '" data-field="interviewTier" data-value="' + i + '" aria-pressed="' + isActive + '">' + t.name + '</button>';
          }).join('') + '</span></span>';

        html += '<span class="nrn-help-text" style="margin:0 0 8px;">By default, questions are asked by someone off-screen \u2014 they\u2019re never shown on camera. Add on-screen talent below if you want a professional interviewer to appear on camera with you instead.</span>';
        html += '<span class="nrn-config-row"><span class="nrn-config-label">\u2795 Add-ons</span>' +
          '<span class="nrn-toggle-row">' +
            '<button type="button" class="nrn-toggle' + (cfg.talent ? ' active' : '') + '" data-service="' + s.id + '" data-field="talent" data-value="toggle" aria-pressed="' + !!cfg.talent + '">\uD83C\uDFA4 On-screen talent \u2014 interviewer appears on camera (+$' + INTERVIEW_TALENT_FEE + ')</button>' +
            '<button type="button" class="nrn-toggle' + (cfg.facility ? ' active' : '') + '" data-service="' + s.id + '" data-field="facility" data-value="toggle" aria-pressed="' + !!cfg.facility + '">\uD83C\uDFE0 Production facility (+$' + INTERVIEW_FACILITY_FEE + ')</button>' +
          '</span></span>';
        html += '<span class="nrn-config-row"><label class="nrn-config-label" for="nrn-ivlocations-' + s.id + '">\uD83D\uDCCD Extra locations beyond primary ($' + INTERVIEW_LOCATION_FEE + ' each, within 20mi)</label>' +
          '<input type="number" id="nrn-ivlocations-' + s.id + '" min="0" step="1" class="nrn-hours-input" data-service="' + s.id + '" data-field="interviewLocations" value="' + cfg.interviewLocations + '" /></span>';
        html += '<span class="nrn-config-row"><label class="nrn-config-label" for="nrn-ivrevisions-' + s.id + '">\uD83D\uDD01 Extra revision rounds beyond the 2 free ($' + INTERVIEW_REVISION_FEE + '/round)</label>' +
          '<input type="number" id="nrn-ivrevisions-' + s.id + '" min="0" step="1" class="nrn-hours-input" data-service="' + s.id + '" data-field="interviewRevisions" value="' + cfg.interviewRevisions + '" /></span>';
      } else if (cfg.videoType === 'raisethebar') {
        html += renderVideoExampleLink(cfg.videoType);
      } else {
        html += renderVideoExampleLink(cfg.videoType);
        html += '<span class="nrn-config-row"><label class="nrn-config-label" for="nrn-hours-' + s.id + '">\uD83D\uDD52 Shoot hours ($' + VIDEO_BASE_SHOOT + ' covers the first ' + VIDEO_BASE_HOURS + ', then $' + VIDEO_EXTRA_HOUR_RATE + '/hr)</label>' +
          '<input type="number" id="nrn-hours-' + s.id + '" min="' + VIDEO_BASE_HOURS + '" step="0.5" class="nrn-hours-input" data-service="' + s.id + '" data-field="hours" value="' + cfg.hours + '" /></span>';
        html += '<span class="nrn-config-row"><span class="nrn-config-label">\u2702\uFE0F Edit length</span><span class="nrn-tiers">' +

            return '<button type="button" class="nrn-tier' + (i === cfg.tierIndex ? ' active' : '') +
              '" data-service="' + s.id + '" data-field="tierIndex" data-value="' + i + '" aria-pressed="' + (i === cfg.tierIndex) + '">' +

        html += '<span class="nrn-config-row"><label class="nrn-config-label" for="nrn-vidlocations-' + s.id + '">\uD83D\uDCCD Extra locations beyond primary ($' + VIDEO_LOCATION_FEE + ' each)</label>' +

        html += '<span class="nrn-config-row"><label class="nrn-config-label" for="nrn-vidrevisions-' + s.id + '">\uD83D\uDD01 Extra revision rounds beyond the 2 free ($' + REVISION_FEE.video + '/round)</label>' +
          '<input type="number" id="nrn-vidrevisions-' + s.id + '" min="0" step="1" class="nrn-hours-input" data-service="' + s.id + '" data-field="revisions" value="' + cfg.revisions + '" /></span>';
        html += '<span class="nrn-config-row"><span class="nrn-config-label">\u2795 Add-ons</span>' +
          '<span class="nrn-toggle-row">' +

          '</span></span>';
      }
    }

    if (s.pricingModel === 'hourly') {
      if (s.id === 'photography') {
        html += '<span class="nrn-help-text" style="margin:0 0 8px;"><a href="' + PHOTOGRAPHY_EXAMPLE_URL + '" target="_blank" rel="noopener noreferrer" style="color:#c9a6ff;">\uD83C\uDFA5 See examples</a></span>';
        html += '<span class="nrn-config-row"><span class="nrn-config-label">\uD83D\uDCCD Where</span>' +
          '<span class="nrn-toggle-row">' +
            '<button type="button" class="nrn-toggle' + (cfg.studio !== 'facility' ? ' active' : '') + '" data-service="' + s.id + '" data-field="studio" data-value="standard" aria-pressed="' + (cfg.studio !== 'facility') + '">\uD83D\uDCCD On-location $' + PHOTO_ON_LOCATION_RATE + '/hr</button>' +
            '<button type="button" class="nrn-toggle' + (cfg.studio === 'facility' ? ' active' : '') + '" data-service="' + s.id + '" data-field="studio" data-value="facility" aria-pressed="' + (cfg.studio === 'facility') + '">\uD83C\uDFE0 In-studio $' + photoFacilityRate(s) + '/hr</button>' +
          '</span></span>';
      }
      html += '<span class="nrn-config-row"><label class="nrn-config-label" for="nrn-hours-' + s.id + '">\uD83D\uDD52 Hours</label>' +
        '<input type="number" id="nrn-hours-' + s.id + '" min="' + s.minHours + '" step="0.5" class="nrn-hours-input" data-service="' + s.id + '" data-field="hours" value="' + cfg.hours + '" /></span>';
      if (s.id === 'photography') {
        html += '<span class="nrn-config-row"><label class="nrn-config-label" for="nrn-extraphotos-' + s.id + '">\uD83D\uDDBC\uFE0F Extra edited photos ($' + PHOTO_EXTRA_PHOTO_SINGLE + '/ea, or ' + PHOTO_EXTRA_PHOTO_BUNDLE_SIZE + ' for $' + PHOTO_EXTRA_PHOTO_BUNDLE_PRICE + ')</label>' +
          '<input type="number" id="nrn-extraphotos-' + s.id + '" min="0" step="1" class="nrn-hours-input" data-service="' + s.id + '" data-field="extraPhotos" value="' + cfg.extraPhotos + '" /></span>';
        html += '<span class="nrn-config-row"><span class="nrn-config-label">\u2795 Add-ons</span>' +
          '<span class="nrn-toggle-row">' +
            '<button type="button" class="nrn-toggle' + (cfg.rushDelivery ? ' active' : '') + '" data-service="' + s.id + '" data-field="rushDelivery" data-value="toggle" aria-pressed="' + !!cfg.rushDelivery + '">\u26A1 Rush delivery, 48hr (+$' + PHOTO_RUSH_FEE + ')</button>' +
          '</span></span>';
      }
    }

    if (s.pricingModel === 'per_page') {
      html += '<span class="nrn-config-row"><label class="nrn-config-label" for="nrn-pages-' + s.id + '">\uD83D\uDCC4 Pages</label>' +
        '<input type="number" id="nrn-pages-' + s.id + '" min="1" step="1" class="nrn-hours-input" data-service="' + s.id + '" data-field="pages" value="' + cfg.pages + '" /></span>';
      html += '<span class="nrn-config-row"><label class="nrn-config-label" for="nrn-webrevisions-' + s.id + '">\uD83D\uDD01 Extra revision rounds beyond the 2 free ($' + REVISION_FEE.web + '/round)</label>' +
        '<input type="number" id="nrn-webrevisions-' + s.id + '" min="0" step="1" class="nrn-hours-input" data-service="' + s.id + '" data-field="revisions" value="' + cfg.revisions + '" /></span>';
    }

    html += '<span class="nrn-breakdown">' + price.breakdown.join('<br>') + '</span>';
    if (s.pricingModel !== 'quote_only') {
      html += '<span class="nrn-config-total">Total: $' + price.total + '</span>';
      if (s.pricingModel === 'hourly_plus_edit' && cfg.videoType !== 'raisethebar') {
        html += '<span class="nrn-help-text" style="margin:8px 0 0;">\uD83D\uDCCC Shoots start at $' + VIDEO_BASE_SHOOT + ' for ' + VIDEO_BASE_HOURS + ' hours, then $' + VIDEO_EXTRA_HOUR_RATE + '/hr, plus edit. Final price may vary based on decisions made in your consultation.</span>';
      }
      if (price.deposit > 0) {
        html += '<span class="nrn-deposit-note">\uD83D\uDCB3 Deposit ' + (price.depositCredited ? 'credited toward this total' : 'in addition to the total above') + ', non-refundable</span>';
      }
    }
    html += '</span>';
    return html;
  }

  function wireConfigControls(s) {
    var card = document.querySelector('.nrn-card[data-id="' + s.id + '"]');
    if (!card) return;
    Array.prototype.forEach.call(card.querySelectorAll('.nrn-tier, .nrn-toggle'), function (btn) {
      btn.addEventListener('click', function (evt) {
        evt.stopPropagation();
        var field = btn.dataset.field;
        var value = btn.dataset.value;
        var cfg = selected[s.id];
        if (field === 'tierIndex') cfg.tierIndex = Number(value);
        else if (field === 'interviewTier') cfg.interviewTier = Number(value);
        else if (field === 'tierToggle') {
          var idx = Number(value);
          var pos = cfg.tierIndices.indexOf(idx);
          if (pos !== -1) {
            // Keep at least one tier selected — a package service with
            // nothing picked has no meaningful price.
            if (cfg.tierIndices.length > 1) cfg.tierIndices.splice(pos, 1);
          } else {
            cfg.tierIndices.push(idx);
          }
        }
        else if (field === 'videoType') {
          cfg.videoType = value;
          // Event recaps always happen at the event — there's no
          // meaningful "in-studio" option for this type.
          if (value === 'recap') cfg.studio = 'standard';
        }
        else if (field === 'studio') cfg.studio = value;
        else if (field === 'talent' || field === 'facility' || field === 'whiteLabel' || field === 'rushDelivery') cfg[field] = !cfg[field];
        saveSelection();
        renderGrid();
        renderLoadout();
        // Re-rendering replaces this button's DOM node, which would
        // otherwise silently drop keyboard focus back to the page body.
        focusConfigControl(s.id, field, value);
      });
    });
    Array.prototype.forEach.call(card.querySelectorAll('.nrn-hours-input'), function (input) {
      input.addEventListener('click', function (evt) { evt.stopPropagation(); });
      input.addEventListener('change', function () {
        var field = input.dataset.field;
        var cfg = selected[s.id];
        var num = Math.max(Number(input.min) || 0, Number(input.value) || 0);
        cfg[field] = num;
        saveSelection();
        renderGrid();
        renderLoadout();
        focusConfigControl(s.id, field, null, input.id);
      });
    });
  }

  // Restores keyboard focus to the equivalent control after a full grid
  // re-render, since innerHTML replacement destroys the original node.
  function focusConfigControl(serviceId, field, value, inputId) {
    var target = inputId
      ? document.getElementById(inputId)
      : document.querySelector('.nrn-card[data-id="' + serviceId + '"] [data-field="' + field + '"][data-value="' + value + '"]');
    if (target) target.focus();
  }

  function toggleService(id) {
    var s = services.find(function (x) { return x.id === id; });
    if (!s) return;
    if (selected.hasOwnProperty(id)) {
      delete selected[id];
    } else {
      selected[id] = defaultConfig(s);
      fetch(SCRIPT_URL + '?action=click&id=' + encodeURIComponent(id)).catch(function () {});
    }
    saveSelection();
    renderGrid();
    renderLoadout();
    renderBundleSuggestion();
    var card = document.querySelector('.nrn-card[data-id="' + id + '"]');
    if (card) card.focus();
  }

  // ---------------- Bundle suggestion ----------------

  function renderBundleSuggestion() {
    var box = document.getElementById('nrn-bundle');
    var selectedIds = Object.keys(selected);
    var match = bundles.find(function (b) {
      return b.requiredServiceIds.length > 0 &&
        b.requiredServiceIds.every(function (id) { return selectedIds.indexOf(id) !== -1; });
    });
    if (match) {
      box.style.display = 'block';
      box.innerHTML = 'That combo qualifies for <strong>' + match.name + '</strong> &mdash; ' + match.description + ' ($' + match.price + ')';
    } else {
      box.style.display = 'none';
    }
  }

  // ---------------- Loadout, booking, and estimate ----------------

  function selectionSummary() {
    return Object.keys(selected).map(function (id) {
      var s = services.find(function (x) { return x.id === id; });
      var price = computePrice(s, selected[id]);
      return s.name + ' (' + price.label + ', $' + price.total + ')';
    }).join(', ');
  }

  function selectionTotal() {
    return Object.keys(selected).reduce(function (sum, id) {
      var s = services.find(function (x) { return x.id === id; });
      return sum + computePrice(s, selected[id]).total;
    }, 0);
  }

  function renderLoadout() {
    var panel = document.getElementById('nrn-loadout');
    var estimateBox = document.getElementById('nrn-estimate');
    var ids = Object.keys(selected);
    if (ids.length === 0) { panel.style.display = 'none'; estimateBox.innerHTML = ''; return; }
    panel.style.display = 'block';

    var total = selectionTotal();
    var rows = ids.map(function (id) {
      var s = services.find(function (x) { return x.id === id; });
      var price = computePrice(s, selected[id]);
      var priceDisplay = s.pricingModel === 'quote_only' ? 'Custom quote' : ('$' + price.total);
      var leftLabel = s.pricingModel === 'quote_only' ? s.name : (s.name + ' &mdash; ' + price.label);
      return '<div class="nrn-loadout-row"><span>' + leftLabel + '</span><span>' + priceDisplay + '</span></div>';
    }).join('');

    panel.innerHTML =
      '<h4>\uD83E\uDDFE 02 // your selections</h4>' +
      '<div class="nrn-help-text">Here\u2019s what you\u2019ve picked so far. Looks good? Hit Continue below.</div>' + rows +
      '<div id="nrn-total"><span>\uD83D\uDCB0 Total</span><span>$' + total + '</span></div>' +
      '<div id="nrn-total-note">Includes deposits. Final invoice may vary — see your service agreement.</div>' +
      '<button id="nrn-continue" type="button">Continue</button>';

    document.getElementById('nrn-continue').addEventListener('click', function () {
      if (leadSubmitted) { showPage('nrn-page-actions'); renderActions(); }

  // ---------------- Direct Google Calendar booking ----------------

  var bookingDate = null;
  var bookingSlots = [];

  function toLocalDateStr(d) {
    // Avoid the UTC-shift bug in toISOString(): late at night in a
    // behind-UTC timezone, toISOString() can render as tomorrow's date.
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  var WEEKDAY_LABELS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
  var MONTH_LABELS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var calendarViewYear, calendarViewMonth; // the month currently displayed in the popover
  var calendarOpen = false;

  function renderBookingPanel() {
    bookingDate = null;
    bookingSlots = [];
    chosenSlot = null;
    calendarOpen = false;
    var today = new Date();
    calendarViewYear = today.getFullYear();
    calendarViewMonth = today.getMonth();
    // If today is near the end of the month, only a handful of days would
    // be selectable on first open — jump straight to next month instead so
    // the calendar opens on a view that's actually useful.
    var daysLeftInMonth = new Date(calendarViewYear, calendarViewMonth + 1, 0).getDate() - today.getDate() + 1;
    if (daysLeftInMonth <= 4) {
      calendarViewMonth++;
      if (calendarViewMonth > 11) { calendarViewMonth = 0; calendarViewYear++; }
    }
    renderDateStep();
  }

  function renderDateStep() {
    var box = document.getElementById('nrn-booking');
    var todayStr = toLocalDateStr(new Date());
    var maxDateObj = new Date();
    maxDateObj.setDate(maxDateObj.getDate() + 30);
    var maxDateStr = toLocalDateStr(maxDateObj);

    var buttonLabel = bookingDate
      ? new Date(bookingDate + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })
      : 'Choose a date';

    box.innerHTML =
      '<div class="nrn-booking-panel">' +
        '<button type="button" class="nrn-link-btn" id="nrn-back-to-actions" style="padding:0 0 10px;">&larr; Back</button>' +
        '<h4>\uD83D\uDD52 05 // pick a time</h4>' +
        '<div class="nrn-help-text">Choose a date below to see open times that day.</div>' +
        '<button type="button" id="nrn-book-date-btn" aria-haspopup="true" aria-expanded="' + calendarOpen + '">\uD83D\uDCC5 ' + buttonLabel + '</button>' +
        '<div id="nrn-calendar-popover" hidden></div>' +
        '<div id="nrn-slots" class="nrn-slots"></div>' +
      '</div>';

    document.getElementById('nrn-back-to-actions').addEventListener('click', function () {
      showPage('nrn-page-actions');
    });
    document.getElementById('nrn-book-date-btn').addEventListener('click', function () {
      calendarOpen = !calendarOpen;
      if (calendarOpen) renderCalendar(todayStr, maxDateStr);
      document.getElementById('nrn-calendar-popover').hidden = !calendarOpen;
      document.getElementById('nrn-book-date-btn').setAttribute('aria-expanded', calendarOpen);
    });

    if (calendarOpen) renderCalendar(todayStr, maxDateStr);
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function renderCalendar(minDateStr, maxDateStr) {
    var pop = document.getElementById('nrn-calendar-popover');
    pop.hidden = false;

    var firstOfMonth = new Date(calendarViewYear, calendarViewMonth, 1);
    var daysInMonth = new Date(calendarViewYear, calendarViewMonth + 1, 0).getDate();
    var startWeekday = firstOfMonth.getDay();

    var minMonth = new Date(minDateStr + 'T00:00:00');
    var maxMonth = new Date(maxDateStr + 'T00:00:00');
    var atMinMonth = calendarViewYear === minMonth.getFullYear() && calendarViewMonth === minMonth.getMonth();
    var atMaxMonth = calendarViewYear === maxMonth.getFullYear() && calendarViewMonth === maxMonth.getMonth();

    var cells = '';
    for (var i = 0; i < startWeekday; i++) {
      cells += '<span class="nrn-cal-day nrn-cal-blank"></span>';
    }
    for (var d = 1; d <= daysInMonth; d++) {
      var cellDate = new Date(calendarViewYear, calendarViewMonth, d);
      var cellStr = toLocalDateStr(cellDate);
      var inRange = cellStr >= minDateStr && cellStr <= maxDateStr;
      var isSelected = bookingDate === cellStr;
      var isToday = cellStr === toLocalDateStr(new Date());
      if (inRange) {
        cells += '<button type="button" class="nrn-cal-day' + (isSelected ? ' active' : '') + (isToday ? ' nrn-cal-today' : '') +
          '" data-date="' + cellStr + '" aria-pressed="' + isSelected + '">' + d + '</button>';
      } else {
        cells += '<span class="nrn-cal-day nrn-cal-disabled">' + d + '</span>';
      }
    }

    pop.innerHTML =
      '<div class="nrn-cal-header">' +
        '<button type="button" id="nrn-cal-prev" aria-label="Previous month"' + (atMinMonth ? ' disabled' : '') + '>&larr;</button>' +
        '<span class="nrn-cal-month-label">' + MONTH_LABELS[calendarViewMonth] + ' ' + calendarViewYear + '</span>' +
        '<button type="button" id="nrn-cal-next" aria-label="Next month"' + (atMaxMonth ? ' disabled' : '') + '>&rarr;</button>' +
      '</div>' +
      '<div class="nrn-cal-grid nrn-cal-weekdays">' + WEEKDAY_LABELS.map(function (w) { return '<span>' + w + '</span>'; }).join('') + '</div>' +
      '<div class="nrn-cal-grid">' + cells + '</div>';

    document.getElementById('nrn-cal-prev').addEventListener('click', function () {
      calendarViewMonth--;
      if (calendarViewMonth < 0) { calendarViewMonth = 11; calendarViewYear--; }
      renderCalendar(minDateStr, maxDateStr);
    });
    document.getElementById('nrn-cal-next').addEventListener('click', function () {
      calendarViewMonth++;
      if (calendarViewMonth > 11) { calendarViewMonth = 0; calendarViewYear++; }
      renderCalendar(minDateStr, maxDateStr);
    });
    Array.prototype.forEach.call(pop.querySelectorAll('.nrn-cal-day[data-date]'), function (btn) {
      btn.addEventListener('click', function () {
        calendarOpen = false;
        loadSlots(btn.dataset.date);
      });
    });
  }

  function loadSlots(dateStr) {
    bookingDate = dateStr;
    var slotsBox = document.getElementById('nrn-slots');
    slotsBox.innerHTML = '<span style="font-size:12px;color:#cec9f6;">Loading times...</span>';

    fetch(SCRIPT_URL + '?action=availability&date=' + encodeURIComponent(dateStr))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        bookingSlots = res.slots || [];
        renderSlotsStep();
      })
      .catch(function () {
        slotsBox.innerHTML = '<span style="font-size:12px;color:#f0997b;">Could not load times — try again.</span>';
      });
  }

  function renderSlotsStep() {
    var box = document.getElementById('nrn-booking');
    var slotsHtml;
    if (bookingSlots.length === 0) {
      slotsHtml = '<span style="font-size:12px;color:#cec9f6;">No open times that day — try another date.</span>';
    } else {
      slotsHtml = '<div class="nrn-slots">' + bookingSlots.map(function (s) {
        return '<button type="button" class="nrn-slot' + (chosenSlot && chosenSlot.time === s.time ? ' active' : '') +
          '" data-time="' + s.time + '" data-label="' + s.label + '">' + s.label + '</button>';
      }).join('') + '</div>';
    }

    box.innerHTML =
      '<div class="nrn-booking-panel">' +
        '<button type="button" class="nrn-link-btn" id="nrn-back-to-date" style="padding:0 0 10px;">&larr; Back to date</button>' +
        '<h4>\uD83D\uDD52 05 // times on ' + bookingDate + '</h4>' +
        '<div class="nrn-help-text">Tap a time that works for you.</div>' +
        slotsHtml +
      '</div>';

    document.getElementById('nrn-back-to-date').addEventListener('click', renderDateStep);
    Array.prototype.forEach.call(box.querySelectorAll('.nrn-slot'), function (btn) {
      btn.addEventListener('click', function () {
        chosenSlot = { date: bookingDate, time: btn.dataset.time, label: btn.dataset.label };
        renderFormStep();
      });
    });
  }

  function renderFormStep() {
    var box = document.getElementById('nrn-booking');
    box.innerHTML =
      '<div class="nrn-booking-panel">' +
        '<button type="button" class="nrn-link-btn" id="nrn-back-to-slots" style="padding:0 0 10px;">&larr; Back to times</button>' +
        '<h4>\u2705 05 // confirm ' + chosenSlot.label + '</h4>' +
        '<div class="nrn-help-text">Enter your name and email to lock in this time.</div>' +
        '<label for="nrn-book-name" style="position:absolute;left:-9999px;">Name</label>' +
        '<input type="text" id="nrn-book-name" class="nrn-book-field" placeholder="Your name" value="' + escapeHtml(leadName) + '" />' +
        '<label for="nrn-book-email" style="position:absolute;left:-9999px;">Email</label>' +
        '<input type="email" id="nrn-book-email" class="nrn-book-field" placeholder="name@email.com" value="' + escapeHtml(leadEmail) + '" />' +
        '<button id="nrn-book-submit" type="button">Confirm ' + chosenSlot.label + '</button>' +
        '<div id="nrn-book-error" role="alert"></div>' +
        '<div id="nrn-book-status"></div>' +
      '</div>';

    document.getElementById('nrn-back-to-slots').addEventListener('click', renderSlotsStep);
    document.getElementById('nrn-book-submit').addEventListener('click', submitBooking);
  }

  function submitBooking() {
    var nameInput = document.getElementById('nrn-book-name');
    var emailInput = document.getElementById('nrn-book-email');
    var errorEl = document.getElementById('nrn-book-error');
    var name = nameInput.value.trim();
    var email = emailInput.value.trim();
    var validEmail = EMAIL_RE.test(email);

    if (!name || !validEmail) {
      errorEl.textContent = !name ? 'Enter your name first.' : 'Enter a valid email address first.';
      errorEl.style.display = 'block';
      return;
    }
    errorEl.style.display = 'none';

    var summary = selectionSummary();
    var total = selectionTotal();
    var submitBtn = document.getElementById('nrn-book-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Booking...';

    postAction({
      action: 'book',
      date: chosenSlot.date,
      time: chosenSlot.time,
      name: name,
      email: email,
      summary: summary,
      total: total
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.success) {
        document.getElementById('nrn-booking').innerHTML =
          '<div class="nrn-booking-panel"><div id="nrn-book-status">Booked for ' + res.time +
          '. Check your email for the Google Meet link.</div></div>';
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Confirm ' + chosenSlot.label;
        errorEl.textContent = res.error || "Couldn't book that — try another time.";
        errorEl.style.display = 'block';
      }
    }).catch(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Confirm ' + chosenSlot.label;
      errorEl.textContent = "Couldn't book that — try again.";
      errorEl.style.display = 'block';
    });
  }

  function renderEstimateForm() {
    var box = document.getElementById('nrn-estimate');
    box.innerHTML =
      '<button type="button" class="nrn-link-btn" id="nrn-back-to-actions-2" style="padding:0 0 10px;">&larr; Back</button>' +
      '<div class="nrn-help-text">Enter your email and we\u2019ll send the total right away.</div>' +
      '<div id="nrn-estimate-form" style="display:flex;">' +
        '<label for="nrn-estimate-email" style="position:absolute;left:-9999px;">Email address</label>' +
        '<input type="email" id="nrn-estimate-email" placeholder="name@email.com" value="' + escapeHtml(leadEmail) + '" />' +
        '<button id="nrn-estimate-submit" type="button" style="background:#ffd54a;color:#2b1600;border:1px solid #ffd54a;border-radius:2px;padding:0 14px;font-weight:bold;font-family:\'JetBrains Mono\',monospace;cursor:pointer;box-shadow:0 0 10px rgba(255,213,74,0.5);">Send</button>' +
      '</div>' +
      '<div id="nrn-estimate-error" role="alert"></div>' +
      '<div id="nrn-estimate-status"></div>';
    document.getElementById('nrn-estimate-form').style.display = 'flex';
    document.getElementById('nrn-back-to-actions-2').addEventListener('click', function () {
      showPage('nrn-page-actions');
    });

    document.getElementById('nrn-estimate-submit').addEventListener('click', function () {
      var input = document.getElementById('nrn-estimate-email');
      var errorEl = document.getElementById('nrn-estimate-error');
      var statusEl = document.getElementById('nrn-estimate-status');
      var email = input.value.trim();
      var validEmail = EMAIL_RE.test(email);

      if (!validEmail) {
        errorEl.textContent = 'Enter a valid email address first.';
        errorEl.style.display = 'block';
        return;
      }
      errorEl.style.display = 'none';

      var summary = selectionSummary();
      var total = selectionTotal();

      postAction({ action: 'estimate', email: email, summary: summary, total: total })
        .then(function (r) { return r.json(); }).then(function (res) {
        if (res.success) {
          statusEl.textContent = "Sent — check your inbox.";
          statusEl.style.display = 'block';
        } else {
          errorEl.textContent = "Couldn't send that — try again in a moment.";
          errorEl.style.display = 'block';
        }
      }).catch(function () {
        errorEl.textContent = "Couldn't send that — try again in a moment.";
        errorEl.style.display = 'block';
      });
    });
  }
})();
</script>
